<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} - NoteWav AI</title>
    <meta name="robots" content="noindex">
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Segoe UI', Arial, sans-serif; background: #0f0f17; color: #e5e5e5; padding: 40px 20px; box-sizing: border-box; }
        .wrap { max-width: 480px; text-align: center; }
        .code { font-size: 3.5rem; font-weight: 800; color: #a78bfa; margin: 0; }
        h1 { font-size: 1.2rem; margin: 8px 0 12px; color: #fff; }
        p { color: #ccc; font-size: 0.95rem; line-height: 1.6; }
        .back { display: inline-block; margin-top: 22px; padding: 10px 24px; border-radius: 999px; background: #6b30ff; color: #fff; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="wrap">
        <p class="code">{{ code }}</p>
        <h1>{{ title }}</h1>
        <p>{{ message }}</p>
        <a class="back" href="/">Back to NoteWav AI</a>
    </div>
</body>
</html>
